# Railway 部署配置
# 这个文件可选，Railway 会自动识别 package.json 的 start 脚本

[build]
builder = "NIXPACKS"

[deploy]
# 健康检查端点（确保服务启动后能响应）
startCommand = "node server.js"

# 环境变量（在 Railway 控制台中设置）：
# PORT=自动注入
# DATA_DIR=/data           # 指向 Railway 持久化卷（需在控制台挂载 Volume）
# JWT_SECRET=你的密钥      # 可选，生产环境强烈建议设置
# ADMIN_USERNAME=admin     # 可选，默认 admin
# ADMIN_PASSWORD=你的密码  # 可选，建议修改默认密码
